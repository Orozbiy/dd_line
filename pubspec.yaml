name: dd_online
description: "Дордойдогу интерактивдүү онлайн базар - DD Online"

publish_to: 'none'

version: 1.0.2+24

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^8.0.0
  app_links: ^6.4.1
  cached_video_player_plus: ^2.0.0
  record: ^7.1.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.2
  share_plus: ^10.0.0
  firebase_core: ^4.10.0          # FCM үчүн калат
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  http: ^1.2.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^18.0.0
  googleapis_auth: ^1.4.1
  flutter_image_compress: ^2.2.0
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  webview_flutter: ^4.7.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  yandex_mapkit: ^4.2.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_ios: "assets/icon/app_icon_ios.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    
    - assets/icon/
    - assets/icons/
    - assets/icons/nav/
    - assets/icons/profile/
    - assets/icons/chat/
    - assets/icons/settings/
    - assets/backgrounds/
    - assets/images/
    - assets/images/categories/
    - assets/images/drawer/akcii.jpg
    - assets/images/drawer/flash_sale.jpg
    - assets/images/drawer/special.jpg
    - assets/sounds/record_start.wav
    - assets/sounds/record_stop.wav
    - assets/sounds/record_cancel.wav
    - assets/sounds/message_sent.wav

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.35