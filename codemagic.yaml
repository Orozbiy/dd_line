workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key  
      
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up code signing settings
        script: |
          # Code signing configured via Codemagic UI
      - name: Build ipa for testing
        script: |
          flutter build ipa --release --export-options-plist=ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration