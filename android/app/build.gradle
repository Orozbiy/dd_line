plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.ddonline.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ddonline.app"
        minSdkVersion 26
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:33.1.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.multidex:multidex:2.0.1'
}

// Copy APK to Flutter's expected location after build
afterEvaluate {
    tasks.matching { it.name == "assembleDebug" }.configureEach { task ->
        task.doLast {
            def srcDir = project.layout.buildDirectory.dir("outputs/flutter-apk").get().asFile
            def destDir = new File(rootProject.projectDir.parentFile, "build/app/outputs/flutter-apk")
            if (srcDir.exists()) {
                destDir.mkdirs()
                copy { from srcDir; into destDir }
                println "✅ APK Flutter build/ папкасына көчүрүлдү"
            }
        }
    }
    tasks.matching { it.name == "assembleRelease" }.configureEach { task ->
        task.doLast {
            def srcDir = project.layout.buildDirectory.dir("outputs/flutter-apk").get().asFile
            def destDir = new File(rootProject.projectDir.parentFile, "build/app/outputs/flutter-apk")
            if (srcDir.exists()) {
                destDir.mkdirs()
                copy { from srcDir; into destDir }
            }
        }
    }
}
